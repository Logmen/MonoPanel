name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make web-stub
      - run: go vet ./...
      - run: go test ./...
      - run: make build

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: cd web && pnpm install --frozen-lockfile && node_modules/.bin/svelte-kit sync && node_modules/.bin/vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  # Full OS matrix (Debian 12/13, Ubuntu 22.04/24.04/26.04, AlmaLinux/Rocky 9/10)
  # needs VMs with systemd, nftables, SELinux: run on a self-hosted runner.
  # `make deploy-dev` reproduces the smoke scenario documented in docs/05-roadmap.md.
