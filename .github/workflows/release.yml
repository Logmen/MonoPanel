name: release
# A tag is the whole release procedure: it builds the packages every server
# updates from, signs their checksums and publishes them. Nothing is uploaded
# by hand — the panel trusts these artefacts by name and by signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки, например v0.6.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build, sign and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: version from the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The binary embeds the web UI, so the real one has to be built first:
      # a release must never ship the placeholder page.
      - name: web UI
        run: make web

      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.0

      - name: packages
        run: make packages VERSION="$VERSION"

      # Servers with a pinned key install nothing that is not signed here.
      - name: sign the checksums
        env:
          MONOPANEL_RELEASE_KEY: ${{ secrets.MONOPANEL_RELEASE_KEY }}
        run: |
          if [ -z "$MONOPANEL_RELEASE_KEY" ]; then
            echo "::warning::MONOPANEL_RELEASE_KEY is not set — the release will be unsigned and panels with a pinned key will refuse it"
            exit 0
          fi
          make sign

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$TAG")
          [ -n "$notes" ] || notes="MonoPanel $VERSION"
          {
            echo "$notes"
            echo
            echo '## Обновление'
            echo '```'
            echo 'mp update'
            echo 'mp update apply'
            echo '```'
            echo 'Панель скачает пакет для своей ОС, проверит подпись и перезапустится сама.'
          } > /tmp/notes.md
          gh release create "$TAG" --title "MonoPanel $VERSION" --notes-file /tmp/notes.md \
            $(ls dist/monopanel_${VERSION}_*.deb dist/monopanel-${VERSION}.*.rpm dist/monopanel-linux-* dist/SHA256SUMS dist/SHA256SUMS.sig 2>/dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/monopanel_*.deb
            dist/monopanel-*.rpm
            dist/monopanel-linux-*
            dist/SHA256SUMS*
