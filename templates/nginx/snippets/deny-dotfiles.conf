# .well-known is ACME and friends; .default is the Bitrix template folder (assets are served from it).
location ~ /\.(?!well-known/|default/) { deny all; return 404; }
location ~* (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|\.user\.ini|\.htaccess|\.htpasswd)$ { deny all; return 404; }
