<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found — MonoPanel</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="glow"></div>
<main class="lost">
  <div class="lost-box rise">
    <a class="logo" href="/en/" aria-label="MonoPanel — home">
      <span class="logo-mark" aria-hidden="true">M</span><span class="brand">MonoPanel</span>
    </a>
    <div class="card">
      <span class="label">Error</span>
      <h1 class="page-title">404</h1>
      <p>There is no such page: it has moved, or the address has a typo.</p>
      <a class="btn btn-primary btn-lg" href="/en/">Home</a>
    </div>
  </div>
</main>
</body>
</html>
