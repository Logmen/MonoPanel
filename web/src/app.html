<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MonoPanel</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light"){document.documentElement.dataset.theme=t}}catch(e){}</script>
    <script>try{var l=localStorage.getItem("lang");if(l!=="ru"&&l!=="en"){var n=((navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""])[0]||"").toLowerCase().split(/[-_]/);l=/^(ru|uk|be|kk|ky|uz|tg|tk|hy|az|ka|os|tt|ba)$/.test(n[0])||(n[0]==="ro"&&n[1]==="md")?"ru":"en"}document.documentElement.lang=l}catch(e){}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
