# The API makes its socket here; the sticky bit keeps it from renaming root's
# entries (the agent's socket, php/ with the pools' sockets).
d /run/monopanel 1771 root monopanel -
# The php-fpm masters make the pools' sockets in php/ as root and hand them
# over by name: root's from boot, before the API, which may write to the run
# directory, could make it its own.
d /run/monopanel/php 0755 root root -
