g monopanel -
g monopanel-web -
g monopanel-cli -
u monopanel - "MonoPanel service" /var/lib/monopanel /usr/sbin/nologin
m monopanel monopanel-cli
# The mail policy's milter (monopanel-mailpolicy.service): its own user, as it
# parses mail from untrusted senders.
u monopanel-mail - "MonoPanel mail policy" / /usr/sbin/nologin
# phpMyAdmin's php-fpm pool (mp db phpmyadmin install): its own user, as it
# runs the PHP of a web application the panel publishes on a port.
u monopanel-pma - "MonoPanel phpMyAdmin" / /usr/sbin/nologin
